# ${KAFKA_HOST:localhost} = use env var KAFKA_HOST if set, else "localhost".
# YOUR machine: authservice publishes to Kafka at 13.207.247.168:9092, so to consume the
# same messages run userservice with  KAFKA_HOST=13.207.247.168  (see userservice-EXPLAINED.md).
spring.kafka.bootstrap-servers=${KAFKA_HOST:13.207.247.168}:${KAFKA_PORT:9092}
spring.kafka.consumer.properties.max.poll.interval.ms=300000
spring.kafka.consumer.properties.session.timeout.ms=45000
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.group-id=userinfo-consumer-group
spring.kafka.consumer.key-deserializer= org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer= com.singhdevhub.userservice.deserializer.UserInfoDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.topic-json.name=user_service
spring.kafka.consumer.properties.spring.json.type.mapping=auth:com.singhdevhub.userservice.entities.UserInfoDto

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# ${MYSQL_HOST:mysql} defaults to "mysql" (a docker-compose service name) - only resolves
# inside docker-compose. Running locally, set MYSQL_HOST=13.207.247.168 (or localhost).
# username/password below are the tutorial's docker defaults - change to match YOUR MySQL.
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:13.207.247.168}:${MYSQL_PORT:3306}/${MYSQL_DB:userservice}?useSSL=false&useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:password}
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create
#spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL8Dialect
#spring.jpa.properties.hibernate.hbm2ddl.auto=update
server.port=9810
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10


logging.level.org.springframework.security=DEBUG
logging.level.org.apache.kafka=DEBUG
logging.level.org.springframework.kafka=DEBUG